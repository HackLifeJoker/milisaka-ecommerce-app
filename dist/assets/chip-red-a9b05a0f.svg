  <!-- Pins -->
  <line x1="16" y1="8" x2="16" y2="12" stroke="#ff3b3b" stroke-width="2"/>
  <line x1="24" y1="8" x2="24" y2="12" stroke="#ff3b3b" stroke-width="2"/>
  <line x1="32" y1="8" x2="32" y2="12" stroke="#ff3b3b" stroke-width="2"/>

  <line x1="16" y1="36" x2="16" y2="40" stroke="#ff3b3b" stroke-width="2"/>
  <line x1="24" y1="36" x2="24" y2="40" stroke="#ff3b3b" stroke-width="2"/>
  <line x1="32" y1="36" x2="32" y2="40" stroke="#ff3b3b" stroke-width="2"/>

  <line x1="8" y1="20" x2="12" y2="20" stroke="#ff3b3b" stroke-width="2"/>
