<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Milisaka, Inc.</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="navbar"></div>
  <main class="main">
    <section class="section section-card">
      <div class="container text-center">
        <span class="eyebrow">// ESTABLISH COMMS</span>
        <h1 class="h1" style="margin-bottom:1.5rem">CONTACT</h1>
        <p class="text-muted" style="font-size:1.125rem;max-width:42rem;margin:0 auto">Reach out to our procurement team for product inquiries, contract discussions, or technical support.</p>
      </div>
    </section>
    <section class="section">
      <div class="container">
        <div style="display:grid;gap:2rem" class="contact-grid">
          <div id="contact-info" style="display:flex;flex-direction:column;gap:1.5rem"></div>
          <div id="contact-form-wrap"></div>
        </div>
      </div>
    </section>
  </main>
  <div id="footer"></div>
  <script type="module" src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
