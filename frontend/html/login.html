<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Milikasa Secure Commerce Node — Login</title>

  <link rel="stylesheet" href="../css/login.css" />
</head>

<body>

  <!-- Background Grid + Scanlines -->
  <div class="terminal-bg"></div>
  <div class="scanlines"></div>

  <!-- Terminal Container -->
  <div class="terminal-wrapper">

    <!-- Logo -->
    <a href="/index.html" class="terminal-logo">
      <img src="/frontend/assets/logo/secure-logo-redwing.svg" alt="Milikasa Logo" />
    </a>

    <!-- Terminal Header -->
    <h1 class="terminal-title">MILISAKA SECURE COMMERCE NODE</h1>
    <p class="terminal-subtitle">ACCESS LEVEL: CIVILIAN</p>

    <!-- Login Panel -->
    <div class="terminal-panel">

      <h2 class="panel-title">USER AUTHENTICATION</h2>

      <form id="login-form">
  <label class="panel-label">Email Address</label>
  <input type="email" id="email" class="panel-input" placeholder="agent@domain.com" />

  <label class="panel-label">Password</label>
  <input type="password" id="password" class="panel-input" placeholder="••••••••" />

  <p id="login-error" class="panel-error"></p>

  <div class="panel-buttons">
    <button type="submit" class="panel-btn primary">LOGIN</button>
    <button type="button" id="register-btn" class="panel-btn secondary">REGISTER</button>
  </div>
</form>

    </div>

    <p class="terminal-footer">MILISAKA, INC. — HARDWARE FOR THE UNFORGIVING</p>

  </div>

  <script type="module" src="../js/login.js"></script>
</body>
</html>
