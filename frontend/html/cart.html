<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart | Milisaka, Inc.</title>

  <link rel="stylesheet" href="/frontend/css/styles.css" />
  <link rel="stylesheet" href="/frontend/css/cart.css" />
</head>

<body class="theme-dark">

  <div id="app">

 <!-- CART MODAL DRAWER -->
<div id="cart-modal-backdrop" class="cart-modal-backdrop hidden">
  <div id="cart-modal" class="cart-modal">

    <button id="cart-modal-close" class="cart-modal-close">✕</button>

    <h2 class="cart-modal-title">Your Cart</h2>

    <div id="cart-modal-items" class="cart-modal-items">
      <!-- Drawer items injected by renderCartDrawer() -->
    </div>

  </div>
</div>



    <main class="cart-page tactical-grid tactical-grid-animated fade-in">

      <section class="cart-items-page" id="cart-items-page">
     
      </section>

      <aside class="cart-summary">
        <h2>ORDER SUMMARY</h2>

        <div class="summary-line">
          <span>Subtotal</span>
          <span id="summary-subtotal">$0.00</span>
        </div>

        <div class="summary-line total">
          <span>Total</span>
          <span id="summary-total">$0.00</span>
        </div>

        <button id="checkout-btn" class="checkout-btn">
          PROCEED TO CHECKOUT
        </button>

        <a href="/frontend/html/products.html" class="continue-shopping">
          CONTINUE SHOPPING
        </a>
      </aside>

    </main>

    <!-- ADD-TO-CART POPUP -->
    <div id="cart-popup" class="cart-popup hidden">
      <p class="popup-title">ADDED TO CART</p>
      <p class="popup-body" id="popup-body-text"></p>
    </div>

  </div>

  <!-- JS Modules (correct order) -->
  <script type="module" src="/frontend/js/app.js"></script>
  <script type="module" src="/frontend/js/navbar.js"></script>
  <script type="module" src="/frontend/js/cart.js"></script>

</body>
</html>
