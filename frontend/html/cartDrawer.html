<!-- GLOBAL MINI CART DRAWER -->
<div id="cart-modal-backdrop" class="cart-modal-backdrop hidden">
  <div id="cart-modal" class="cart-modal">

    <!-- Close Button -->
    <button id="cart-modal-close" class="cart-modal-close">✕</button>

    <!-- Drawer Title -->
    <h2 class="cart-modal-title">Your Cart</h2>

    <!-- Drawer Items -->
    <div id="cart-modal-items" class="cart-modal-items">
      <!-- Items injected by renderCartDrawer() -->
    </div>

    <!-- Subtotal -->
    <div class="drawer-subtotal">
      <span>Subtotal:</span>
      <span id="drawer-subtotal-amount">$0.00</span>
    </div>

    <!-- View Cart Button -->
    <button id="view-cart-btn" class="cart-view-btn">
      VIEW CART
    </button>

  </div>
</div>
