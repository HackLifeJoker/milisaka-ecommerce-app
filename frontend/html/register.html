<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Milikasa Secure Commerce Node — Register</title>

  <link rel="stylesheet" href="../css/login.css" />
</head>

<body>

  <!-- Background Grid + Scanlines -->
  <div class="terminal-bg"></div>
  <div class="scanlines"></div>

  <!-- Terminal Container -->
  <div class="terminal-wrapper">

    <!-- Logo -->
    <a href="/index.html" class="terminal-logo">
      <img src="/frontend/assets/logo/Milisaka-Inc-logo-transparent.png" alt="Milikasa Logo" />
    </a>

    <!-- Terminal Header -->
    <h1 class="terminal-title">MILISAKA SECURE COMMERCE NODE</h1>
    <p class="terminal-subtitle">ACCOUNT CREATION — ACCESS LEVEL: CIVILIAN</p>

    <!-- Registration Panel -->
    <div class="terminal-panel">

      <h2 class="panel-title">CREATE USER CREDENTIALS</h2>

      <label class="panel-label">Email Address</label>
      <input type="email" id="email" class="panel-input" placeholder="agent@domain.com" />

      <label class="panel-label">Password</label>
      <input type="password" id="password" class="panel-input" placeholder="Minimum 6 characters" />

      <label class="panel-label">Confirm Password</label>
      <input type="password" id="confirm-password" class="panel-input" placeholder="Re-enter password" />

      <!-- Error Message -->
      <p id="register-error" class="panel-error"></p>

      <!-- Buttons -->
      <div class="panel-buttons">
        <button id="create-account-btn" class="panel-btn primary">CREATE ACCOUNT</button>
        <button id="back-to-login-btn" class="panel-btn secondary">BACK TO LOGIN</button>
      </div>

    </div>

    <!-- Footer -->
    <p class="terminal-footer">MILISAKA, INC. — HARDWARE FOR THE UNFORGIVING</p>

  </div>

  <script type="module" src="../js/register.js"></script>
</body>
</html>
